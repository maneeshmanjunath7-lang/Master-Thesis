[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full891-fresh-simulation"
version = "2.1.0"
description = "Storage-bounded end-to-end Full891 DSS simulation and thesis analysis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<23",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "psutil>=5.9,<8",
  "tqdm>=4.66,<5",
]

[project.scripts]
full891 = "full891_fresh.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
