[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-postprocessing"
version = "1.0.0"
description = "Read-only, ZIP-native post-processing for the dual-region full891 thesis campaign"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "scipy>=1.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

